[project]
name = "async-file-processor"
version = "0.1.0"
description = "Async file processing pipeline with validation and metadata extraction"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.0",
]

# ---------------------------
# Tooling: Black
# ---------------------------
[tool.black]
line-length = 88
target-version = ["py310"]

# ---------------------------
# Tooling: Ruff
# ---------------------------
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

# ---------------------------
# Pytest config
# ---------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"